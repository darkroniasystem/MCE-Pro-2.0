[project]
name = "mce-pro"
version = "2.0.0"
description = "Media Cleaner & Enrichment - Catálogo Maestro Multimedia"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.12",
    "pydantic>=2.0",
    "pyside6>=6.5",
    "ijson>=3.2",
    "httpx>=0.25",
    "tenacity>=8.2",
    "structlog>=23.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
